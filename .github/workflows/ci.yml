name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node src/lib/html.test.mjs
      - name: Generated HTML is up to date
        run: node src/build.mjs --check
      - name: Links and assets resolve
        run: node src/check-links.mjs
